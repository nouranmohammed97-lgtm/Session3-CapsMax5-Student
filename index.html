<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bullying – CapsMax 5 Session 3</title>
<style>
:root{--y:#B8860B;--yd:#8A6508;--yl:#FFF3C4;--ink:#2b2200;--ok:#2e7d32;--no:#c62828}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:#fff;color:var(--ink);font-family:"Segoe UI",Arial,sans-serif}
#app{display:flex;flex-direction:column;height:100%}
header{background:var(--y);color:#fff;padding:10px 22px;display:flex;align-items:center;gap:14px}
header h1{margin:0;font-size:clamp(20px,3.2vw,34px);flex:1}
#bar{height:6px;background:var(--yl)}#bar i{display:block;height:100%;width:0;background:var(--yd);transition:width .3s}
main{flex:1;overflow:auto;padding:16px 26px;position:relative;display:flex;flex-direction:column;gap:12px}
.hint{background:var(--yl);border-left:6px solid var(--y);padding:8px 14px;border-radius:6px;font-size:clamp(14px,1.7vw,19px)}
.hint:before{content:"👉 "}
ul.b,ol.b{font-size:clamp(20px,3.2vw,36px);font-weight:700;line-height:1.35;margin:auto 0;padding-left:1.3em}
ol.b{font-size:clamp(18px,2.7vw,30px)}
.row{display:flex;gap:18px;align-items:center;flex:1;min-height:0}.row>*{min-width:0}
img.big{max-width:100%;max-height:100%;object-fit:contain;border:4px solid var(--y);border-radius:10px}
.imgbox{flex:1;display:flex;justify-content:center;align-items:center;min-height:0;height:100%}
.mas{position:absolute;right:8px;bottom:6px;height:90px;opacity:.95;pointer-events:none}
.cover{flex-direction:row;padding:0;gap:0}.cover .pic{flex:1;background-size:cover;background-position:center;position:relative}
.cover h2{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);margin:0;background:var(--y);color:#fff;padding:10px 34px;border-radius:40px;font-size:clamp(28px,5vw,60px)}
.cloud{background:var(--y);color:#fff;font-weight:800;border-radius:40px;padding:26px 30px;font-size:clamp(20px,3vw,34px);max-width:420px;text-align:center;transform:rotate(-8deg)}
.card{border:2px solid var(--y);border-radius:12px;padding:10px 16px;font-size:clamp(16px,2.3vw,26px);display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.card .q{flex:1;min-width:200px}.card.ok{background:#e8f5e9;border-color:var(--ok)}.card.no{background:#fdecea;border-color:var(--no)}
.card.sh{background:var(--yl)}
button{font:inherit;cursor:pointer;border:2px solid var(--y);background:#fff;color:var(--yd);border-radius:10px;padding:6px 14px;font-weight:700}
button:hover{background:var(--yl)}button.on{background:var(--y);color:#fff}button.p{background:var(--y);color:#fff}
.ctl{display:flex;gap:10px;flex-wrap:wrap}
.score{font-weight:800;font-size:22px;color:var(--yd);align-self:center}
.word{font-size:clamp(40px,8vw,90px);font-weight:900;color:var(--y);text-align:center;margin:6px 0}
.opt{display:block;width:100%;text-align:left;font-size:clamp(18px,2.8vw,32px);margin:8px 0;padding:14px 18px}
.opt.ok{background:#e8f5e9;border-color:var(--ok);color:var(--ok)}.opt.no{background:#fdecea;border-color:var(--no);color:var(--no)}.opt.sh{background:var(--yl);border-color:var(--yd)}
footer{display:flex;align-items:center;gap:10px;padding:8px 22px;border-top:2px solid var(--yl)}
footer .sp{flex:1;text-align:center;font-weight:700;color:var(--yd)}
#notes{display:none;background:#fffdf3;border:2px dashed var(--y);border-radius:10px;padding:10px 16px;font-size:15px;max-height:38%;overflow:auto}
#notes.show{display:block}#notes h4{margin:0 0 6px;color:var(--yd)}#notes p{margin:4px 0}
.art{font-size:clamp(14px,1.8vw,20px);line-height:1.45;overflow:auto}.art h3{margin:10px 0 2px;color:var(--yd)}.art p{margin:4px 0}
.bub{max-width:78%;padding:8px 14px;border-radius:16px;font-size:clamp(15px,2vw,23px)}.bub.a{background:var(--yl);align-self:flex-start;border-bottom-left-radius:2px}.bub.b{background:var(--y);color:#fff;align-self:flex-end;border-bottom-right-radius:2px}.bub small{display:block;font-weight:800;opacity:.75}.chat{display:flex;flex-direction:column;gap:7px;border:2px dashed var(--y);border-radius:12px;padding:10px 14px}.lnk{display:inline-block;background:var(--y);color:#fff;font-weight:800;text-decoration:none;border-radius:10px;padding:10px 18px;font-size:clamp(16px,2.2vw,24px)}.timer{font-size:20px;padding:2px 10px;margin-left:6px}
.name{font-size:clamp(18px,2.6vw,28px);padding:10px 14px;border:3px solid var(--y);border-radius:10px;width:min(420px,100%)}
.cert{border:12px double var(--y);border-radius:14px;text-align:center;padding:24px;margin:auto;max-width:900px;width:100%;background:#fff}
.cert h2{font-size:clamp(28px,5vw,56px);color:var(--y);margin:0}.cert .n{font-size:clamp(30px,6vw,64px);font-weight:900;border-bottom:3px solid var(--y);display:inline-block;padding:0 30px;margin:14px 0}
@media print{body *{visibility:hidden}.cert,.cert *{visibility:visible}.cert{position:fixed;left:5%;top:10%;width:90%}}
</style></head><body><div id="app">
<header><h1 id="ttl"></h1></header>
<div id="bar"><i id="pg"></i></div>
<main id="m"></main>
<footer><button onclick="go(-1)">◀ Previous</button><div class="sp" id="ct"></div><button class="p" onclick="go(1)">Next ▶</button></footer>
</div>

const art=[
 `<img class="big" src="${I.a1}" style="float:right;max-width:34%;margin:0 0 8px 12px"><p><b>WHY DO PEOPLE BULLY? 9 REASONS FOR BULLYING</b><br>SAMUEL HA<br>FIGHT BULLYING</p><p>To understand the answer to this you have to step inside the mind of a bully. You have to look at their past and why they’ve become the person that they are. Bullies, like most people, can change their ways. Here are 9 reasons for bullying.</p><h3>1) THE BULLY HAS BEEN BULLIED BEFORE</h3><p>Many bullies have been bullied before, whether by family or just by their peers. They may have been teased to a point where they feel insignificant, which makes them so angry that they have to take it out on someone else.</p><p>Especially if it happened to them in their childhood years, they could grow up with a bully mentality because it’s all they know. Of course, this goes both ways as someone who has been bullied before can turn out to be a great person.</p><h3>2) THE BULLY IS LONELY</h3><p>Feeling unimportant and left out can contribute to bullying. Everyone needs attention and sometimes, those who don’t have enough will turn into bullies.</p><p>It’s what they feel gives them power and a sense of importance. Even if they have many friends, they may still crave the attention they feel they deserve but are not getting.</p>`,
 `<h3>3) THE BULLY HAS PROBLEMS AT HOME</h3><p>It’s common for a bully to have had problems at home. This could be physical or verbal abuse that will affect someone’s mind. That could turn a normal person into an aggressive and emotional being with a fragile mind. You have to understand that if this is the case, then the bully is a victim too.</p><h3>4) THE BULLY HAS LOW SELF-ESTEEM</h3><p>If someone feels that they’re not smart enough, attractive enough or worthy enough, then they have to make themselves feel better about themselves. Whatever the reason is, the easiest way for them to achieve that is by putting someone else down. However, they’ll find out sooner or later that it’s a losing strategy because someone will fight back. Unfortunately, they will probably just go back to finding a weaker person to pick on.</p><h3>5) THE BULLY IS JEALOUS</h3><p>This ties in with the previous reason of the bully having low self-esteem. However, if a bully is jealous of a particular person then they’ll take their frustrations out on that person. The main reason for jealously is often popularity. The victim could be more popular than the bully which truly gets on their nerves.</p>`,
 `<h3>6) THE BULLY IS PART OF A PACK</h3><p>More often than not, bullies roll in groups. They want a sense of security just in case someone decides to fight back, then they can call for back up. Usually, if they were alone, this reduces their confidence and they will wait until they feel safe.</p><p>The bully’s peers can either be bullies themselves or just popular people who are good at dealing with others. You have to filter out the good from the bad in the group.</p><img class="big" src="${I.a2}" style="max-width:260px;display:block;margin:6px auto"><h3>7) THE BULLY HAS A BIG EGO</h3><p>Some bullies don’t fit any of the above criteria. Their main motivation for bullying simply boils down to having a big ego. Their arrogance has made themselves believe that they’re the best thing since sliced bread. Until someone challenges them on this, they’ll continue to have the same frame of mind.</p>`,
 `<h3>8) THE BULLY LIKES TO IMPRESS</h3><p>Certain people want to be the center of attention. We all know someone like that. There’s nothing wrong with that but a bully chooses to get that attention in the wrong way. They usually don’t have any particular talent or skills that can impress people so they have to poke fun at someone to get some laughs. Because of this, they feel that they’ve left a good impression among their peers.</p><h3>9) THE BULLY SEES YOU AS BEING DIFFERENT</h3><p>A bully will pick out their target based on a specific reason. You could be different in some way, whether it’s by race, sexuality, disability or something else. They will single you out and verbally and/or physically abuse you. Usually, they won’t let you know the reason but most of the time it’s obvious.</p><p><b><i>A bully could fall under one or maybe even all of the above reasons…</i></b></p><p>…Some change within time while others remain a bully for the rest of their lives. It just depends on whether something or someone can change their mentality or not. Different circumstances and events can transform someone into a cool and understanding person. Unfortunately, it can also turn them into a complete bully.</p>`];

 if(s.c)h+=`<div class="ctl"><button onclick="cv()">💬 ${x.cv?'Hide':'Show'} example conversation</button></div>`+(x.cv?`<div class="chat">${s.c.map((l,i)=>`<div class="bub ${i%2?'b':'a'}"><small>${l[0]}</small>${l[1]}</div>`).join('')}</div>`:'');
 
 $('m').innerHTML=h;
 $('ct').textContent=(cur+1)+' / '+S.length;$('pg').style.width=((cur+1)/S.length*100)+'%';
}
function quiz(s,x){
 let h=s.pre||'';if(s.num)h+='';
 const m=x.mode;let sc=0;
 s.items.forEach((it,i)=>{
  const v=x.sel[i],ans=it.a,ok=(v??(it.tog?0:-1))==ans;if(m=='checked'&&ok)sc++;
  let cls='card';if(m=='checked')cls+=ok?' ok':' no';if(m=='shown')cls+=' sh';
  let btns='';
  if(it.tog){const sh=m=='shown'?ans:(v||0);btns=`<button class="${sh?'on':''}" onclick="pick(${i},${v?0:1})" style="font-size:1.3em">${it.o[sh]}</button>`}
  else it.o.forEach((o,j)=>{let c='';if(m=='shown')c=j==ans?'opt sh':'opt';else if(m=='checked'&&v==j)c=ok?'opt ok':'opt no';else c=v==j?'on':'';
   btns+=it.vert?`<button class="opt ${c.replace('opt','')}" onclick="pick(${i},${j})">${o}</button>`:`<button class="${c}" style="min-width:48px" onclick="pick(${i},${j})">${o}</button>`});
  h+=it.vert?btns:`<div class="${cls}"><span class="q">${s.num?(i+1)+'. ':''}${it.q}</span>${btns}</div>`;
 });
 const tot=s.items.length;
 h+=`<div class="ctl"><button class="p" onclick="mode('checked')">✔ Check</button><button onclick="mode('shown')">👁 Show answers</button><button onclick="mode('edit')">🙈 Hide answers</button><button onclick="again()">🔄 Try it again</button><span class="score">${m=='checked'?'Score: '+sc+' / '+tot+(sc==tot?' 🎉':''):''}</span></div>`;
 return h;
}
function cv(){st[cur].cv=!st[cur].cv;render()}
function pick(i,j){const x=st[cur];if(x.mode=='shown')return;x.mode='edit';x.sel[i]=j;render()}
function mode(m){st[cur].mode=m;render()}
function again(){st[cur]={sel:[],mode:'edit',cv:st[cur].cv};render()}
function go(d){cur=Math.max(0,Math.min(S.length-1,cur+d));render()}
document.onkeydown=e=>{if(e.target.tagName=='INPUT')return;if(e.key=='ArrowRight')go(1);if(e.key=='ArrowLeft')go(-1)};
function timer(b,m){clearInterval(b._t);let t=m*60;b._t=setInterval(()=>{t--;b.textContent='⏱ '+Math.floor(t/60)+':'+String(t%60).padStart(2,'0');if(t<=0){clearInterval(b._t);b.textContent='⏰ Time!'}},1000);b.textContent='⏱ '+m+':00'}
render();
</script></body></html>
